name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [development, test, production]
        default: development

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy selected environment
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Require the host connection
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "This environment is waiting on VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID."
            exit 1
          fi
          echo "Ready to deploy ${{ inputs.target }}."
